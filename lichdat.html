<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lịch đặt sân</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
        }

        h2 {
            text-align: center;
            margin: 30px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #28a745;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Lịch đặt sân của bạn</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Tên sân</th>
                <th>Thời gian</th>
                <th>Địa chỉ</th>
                <th>hủy sân</th>
            </tr>
        </thead>

        <tbody id="danhsach"></tbody>

    </table>

    <script>

        let lich = JSON.parse(localStorage.getItem("lich")) || [];

        let html = "";

        for (let i = 0; i < lich.length; i++) {

            html += `
            <tr>
            <td>${lich[i].san}</td>
            <td>${lich[i].thoigian}</td>
            <td>${lich[i].diachi}</td>
            <td><button onclick="huySan(${i})">Hủy</button></td>
            </tr>
        `   ;

        }

        document.getElementById("danhsach").innerHTML = html;
        function huySan(index) {

            let lich = JSON.parse(localStorage.getItem("lich")) || [];

            lich.splice(index, 1);

            localStorage.setItem("lich", JSON.stringify(lich));

            location.reload();

        }


    </script>

</body>

</html>
